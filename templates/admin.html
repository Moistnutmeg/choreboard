<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/static/choreboard_icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chore chart admin</title>
<style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-style: normal; font-display: swap; src: url('/static/fonts/JetBrainsMono-Regular.ttf') format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-style: normal; font-display: swap; src: url('/static/fonts/JetBrainsMono-Bold.ttf') format('truetype'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sky:    #dff1fb;
  --sky2:   #bfe2f5;
  --shell:  #8fcdf0;
  --navy:   #2b4c7e;
  --text:   #1f3a5a;
  --muted:  #46688f;
  --pink:   #ff8fb1;
  --pink-d: #e0608a;
}
body { background: var(--sky); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; color: var(--text); min-height: 100vh; }

header {
  background: #fff;
  border-bottom: 3px solid var(--navy);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  position: sticky; top: 0; z-index: 10;
}
.logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.save-all-btn {
  background: var(--shell); border: 3px solid var(--navy); border-radius: 14px; box-shadow: 0 4px 0 var(--navy);
  padding: 9px 22px; color: var(--text); font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.save-all-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--navy); }
.save-all-btn:focus-visible, .field-input:focus-visible, .em-inp:focus-visible, .cn-inp:focus-visible { outline: 3px solid var(--pink-d); outline-offset: 2px; }

.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--navy); color: #fff; padding: 10px 24px;
  border-radius: 14px; font-size: 15px; font-weight: 700;
  opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none;
}
.toast.show { opacity: 1; }

main { max-width: 780px; margin: 0 auto; padding: 26px 16px 56px; display: flex; flex-direction: column; gap: 26px; }

.card { background: #fff; border-radius: 20px; border: 3px solid var(--navy); box-shadow: 0 6px 0 var(--navy); overflow: hidden; }
.card-header { padding: 14px 20px; border-bottom: 3px solid var(--navy); background: var(--sky2); display: flex; align-items: center; gap: 12px; }
.card-header h2 { font-size: 17px; font-weight: 700; }
.card-header .badge { background: #fff; border: 2px solid var(--navy); color: var(--text); font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 20px; }
.card-header .badge.weekly { background: var(--pink); }
.card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }

.field-row { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 14px; font-weight: 700; color: var(--muted); }
.field-input, .em-inp, .cn-inp {
  border: 2px solid var(--navy); border-radius: 12px;
  color: var(--text); font-family: inherit; background: #fff;
}
.field-input { width: 100%; padding: 10px 14px; font-size: 16px; }
.field-input:focus, .em-inp:focus, .cn-inp:focus { border-color: var(--pink-d); outline: none; box-shadow: 0 0 0 3px var(--sky2); }

.chore-list { display: flex; flex-direction: column; gap: 10px; }
.chore-row { display: flex; align-items: center; gap: 8px; }
.chore-num { font-size: 13px; font-weight: 700; color: var(--muted); width: 18px; flex-shrink: 0; text-align: right; }
.em-inp { width: 56px; flex-shrink: 0; padding: 8px 4px; font-size: 22px; text-align: center; }
.cn-inp { flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px; font-weight: 700; }

.preview-strip { background: var(--sky); border: 2px solid var(--navy); border-radius: 14px; padding: 12px 16px; }
.preview-strip .plabel { font-size: 13px; color: var(--muted); font-weight: 700; }
.preview-chores { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.preview-chip { background: #fff; border: 2px solid var(--navy); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
</style>
</head>
<body>

<div class="toast" id="toast">Saved</div>

<header>
  <div class="logo">Chore chart admin</div>
  <button class="save-all-btn" onclick="saveAll()">Save changes</button>
</header>

<main>

  <!-- NAME -->
  <div class="card">
    <div class="card-header">
      <h2>Name</h2>
    </div>
    <div class="card-body">
      <div class="field-row">
        <label class="field-label" for="child-name">Name shown on the chart</label>
        <input class="field-input" id="child-name" type="text" maxlength="20" placeholder="e.g. Sam">
      </div>
    </div>
  </div>

  <!-- DAILY -->
  <div class="card">
    <div class="card-header">
      <h2>☀️ Daily chores</h2>
      <span class="badge">starts again every day</span>
    </div>
    <div class="card-body">
      <div class="field-row">
        <label class="field-label" for="daily-reward">Daily reward</label>
        <input class="field-input" id="daily-reward" type="text" maxlength="40" placeholder="e.g. 🍦 Ice cream">
      </div>
      <div class="field-row">
        <div class="field-label">Chores</div>
        <div class="chore-list" id="daily-chores"></div>
      </div>
      <div class="preview-strip" id="daily-preview">
        <div class="plabel">Preview</div>
        <div class="preview-chores" id="daily-preview-chips"></div>
      </div>
    </div>
  </div>

  <!-- WEEKLY -->
  <div class="card">
    <div class="card-header">
      <h2>📅 Weekly chores</h2>
      <span class="badge weekly">starts again every Friday</span>
    </div>
    <div class="card-body">
      <div class="field-row">
        <label class="field-label" for="weekly-reward">Weekly reward</label>
        <input class="field-input" id="weekly-reward" type="text" maxlength="40" placeholder="e.g. 🎬 Movie night">
      </div>
      <div class="field-row">
        <div class="field-label">Chores</div>
        <div class="chore-list" id="weekly-chores"></div>
      </div>
      <div class="preview-strip">
        <div class="plabel">Preview</div>
        <div class="preview-chores" id="weekly-preview-chips"></div>
      </div>
    </div>
  </div>

</main>

<script>
let config = null;

async function loadConfig() {
  const res = await fetch('/api/config');
  config = await res.json();
  populate();
}

function buildChoreList(containerId, chores, type) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  chores.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'chore-row';
    row.innerHTML =
      '<span class="chore-num">' + (i+1) + '</span>' +
      '<input class="em-inp" id="' + type + '-em-' + i + '" type="text" maxlength="2" value="' + esc(c.emoji) + '" oninput="updatePreview(\'' + type + '\')">' +
      '<input class="cn-inp" id="' + type + '-cn-' + i + '" type="text" maxlength="28" value="' + esc(c.name) + '" placeholder="Chore name" oninput="updatePreview(\'' + type + '\')">';
    el.appendChild(row);
  });
  updatePreview(type);
}

function updatePreview(type) {
  const chips = document.getElementById(type + '-preview-chips');
  chips.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const em = document.getElementById(type + '-em-' + i);
    const cn = document.getElementById(type + '-cn-' + i);
    if (!em || !cn) continue;
    const chip = document.createElement('div');
    chip.className = 'preview-chip';
    chip.textContent = (em.value || '?') + ' ' + (cn.value || 'Chore ' + (i+1));
    chips.appendChild(chip);
  }
}

function populate() {
  document.getElementById('child-name').value   = config.child_name || '';
  document.getElementById('daily-reward').value  = config.daily.reward || '';
  document.getElementById('weekly-reward').value = config.weekly.reward || '';
  buildChoreList('daily-chores',  config.daily.chores,  'daily');
  buildChoreList('weekly-chores', config.weekly.chores, 'weekly');
}

function readChores(type) {
  return Array.from({length: 6}, (_, i) => ({
    emoji: (document.getElementById(type + '-em-' + i).value.trim() || config[type].chores[i].emoji),
    name:  (document.getElementById(type + '-cn-' + i).value.trim() || config[type].chores[i].name),
  }));
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function saveAll() {
  const newConfig = {
    child_name: document.getElementById('child-name').value.trim() || config.child_name,
    daily: {
      reward: document.getElementById('daily-reward').value.trim() || config.daily.reward,
      chores: readChores('daily'),
    },
    weekly: {
      reward: document.getElementById('weekly-reward').value.trim() || config.weekly.reward,
      chores: readChores('weekly'),
    }
  };
  await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(newConfig),
  });
  config = newConfig;
  showToast();
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadConfig();
</script>
</body>
</html>
