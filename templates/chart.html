<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/static/choreboard_icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chore chart">
<title>Chore chart</title>
<style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-style: normal; font-display: swap; src: url('/static/fonts/JetBrainsMono-Regular.ttf') format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-style: normal; font-display: swap; src: url('/static/fonts/JetBrainsMono-Bold.ttf') format('truetype'); }
/* Written for an old iPad mini (iOS 12 Safari): no flex gap, no inset, no clamp(), no aspect-ratio. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --sky:    #dff1fb;
  --sky2:   #bfe2f5;
  --shell:  #8fcdf0;
  --navy:   #2b4c7e;
  --text:   #1f3a5a;
  --muted:  #46688f;
  --pink:   #ff8fb1;
  --pink-d: #e0608a;
}

html, body {
  height: 100%;
  background: var(--sky);
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  overflow: hidden;
  color: var(--text);
  -webkit-user-select: none; user-select: none;
}

.app {
  display: -webkit-flex; display: flex;
  flex-direction: column;
  height: 100vh;
  height: -webkit-fill-available;
  padding: 16px 22px 20px;
}

/* HEADER: title, tabs, tools on one row */
.top { display: flex; align-items: center; flex-shrink: 0; margin-bottom: 16px; }
.title { flex: 1; font-size: 30px; font-weight: 700; letter-spacing: -1px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabs { display: flex; margin-right: 14px; }
.tab {
  background: #fff;
  border: 3px solid var(--navy);
  border-radius: 16px;
  box-shadow: 0 4px 0 var(--navy);
  padding: 7px 16px 8px;
  margin-left: 12px;
  text-align: center;
  font-size: 19px; font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
}
.tab small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 1px; }
.tab.active { background: var(--shell); transform: translateY(4px); box-shadow: 0 0 0 var(--navy); }

.tool {
  background: #fff;
  border: 3px solid var(--navy);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--navy);
  width: 52px; height: 52px;
  margin-left: 10px;
  font-size: 22px; line-height: 1;
  cursor: pointer; font-family: inherit;
}
.tool:active { transform: translateY(4px); box-shadow: 0 0 0 var(--navy); }

/* CONTENT */
.content { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 280px; grid-column-gap: 24px; }
.left { display: flex; flex-direction: column; min-height: 0; }

/* CHORE STICKERS */
.chore-grid {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 1fr;
  grid-gap: 22px 18px;
  padding-bottom: 6px;
}
.chore {
  background: #fff;
  border: 3px solid var(--navy);
  border-radius: 22px;
  box-shadow: 0 7px 0 var(--navy);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
  padding: 10px 14px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
}
.chore:active { transform: translateY(3px); box-shadow: 0 4px 0 var(--navy); }
.chore.done { background: var(--sky2); transform: translateY(7px); box-shadow: 0 0 0 var(--navy); }
.chore-emoji { font-size: 82px; line-height: 1; margin-bottom: 14px; }
.chore-name  { font-size: 21px; font-weight: 700; line-height: 1.2; overflow-wrap: break-word; max-width: 100%; }
.stamp { position: absolute; top: 10px; right: 12px; width: 38px; height: 34px; opacity: 0; -webkit-transform: scale(0.3); transform: scale(0.3); transition: opacity 0.15s, transform 0.2s; }
.chore.done .stamp { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }

.reward {
  flex-shrink: 0;
  margin-top: 16px;
  background: #fff;
  border: 3px solid var(--navy);
  border-radius: 18px;
  padding: 8px 16px;
  font-size: 18px; font-weight: 700; line-height: 1.25;
  overflow-wrap: break-word;
  text-align: center;
}
.reward span { color: var(--pink-d); }

/* ALL DONE */
.complete {
  flex: 1; min-height: 0;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: #fff;
  border: 3px solid var(--navy);
  border-radius: 26px;
  box-shadow: 0 7px 0 var(--navy);
  margin-bottom: 7px;
  padding: 20px; text-align: center;
}
.complete.show { display: flex; }
.big-emoji { font-size: 60px; line-height: 1; margin-bottom: 12px; }
.congrats  { font-size: 38px; font-weight: 700; letter-spacing: -1.5px; }
.won-label { font-size: 20px; color: var(--muted); margin-top: 14px; font-weight: 400; }
.reward-won { font-size: 34px; font-weight: 700; color: var(--pink-d); margin-top: 4px; }
.reset-btn {
  margin-top: 22px;
  background: var(--shell);
  border: 3px solid var(--navy); border-radius: 18px; box-shadow: 0 5px 0 var(--navy);
  padding: 12px 30px;
  color: var(--text); font-size: 20px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.reset-btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--navy); }

/* PIXEL PAL: a little handheld that mirrors today's progress */
.device {
  background: var(--shell);
  border: 4px solid var(--navy);
  border-radius: 140px 140px 70px 70px;
  box-shadow: 0 7px 0 var(--navy);
  margin-bottom: 7px;
  padding: 34px 22px 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  min-height: 0;
}
.speech {
  background: #fff; border: 3px solid var(--navy); border-radius: 16px;
  width: 100%; min-height: 76px; padding: 10px 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; line-height: 1.25; text-align: center;
}
.lcd {
  position: relative;
  width: 100%; height: 268px;
  background: #eaf7fc;
  border: 4px solid var(--navy); border-radius: 18px;
  box-shadow: inset 0 0 0 4px #cfeaf7;
  overflow: hidden;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 14px;
  cursor: pointer;
}
.ground { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 4px; background: repeating-linear-gradient(90deg, var(--navy) 0, var(--navy) 8px, transparent 8px, transparent 14px); opacity: 0.35; }
.pet { width: 216px; height: 216px; position: relative; }
.pet svg { width: 100%; height: 100%; display: block; }
.zzz { position: absolute; top: 14px; right: 20px; font-size: 24px; font-weight: 700; color: var(--navy); display: none; }
.pet.sleep ~ .zzz { display: block; -webkit-animation: zzz 2.4s steps(4) infinite; animation: zzz 2.4s steps(4) infinite; }

/* two-frame LCD motion: steps() snaps between positions like a real pixel toy */
.pet.sleep { -webkit-animation: breathe 2.4s steps(1, end) infinite; animation: breathe 2.4s steps(1, end) infinite; }
.pet.idle  { -webkit-animation: bob 1.2s steps(1, end) infinite; animation: bob 1.2s steps(1, end) infinite; }
.pet.happy { -webkit-animation: bob 0.8s steps(1, end) infinite; animation: bob 0.8s steps(1, end) infinite; }
.pet.dance { -webkit-animation: hop 0.5s steps(1, end) infinite; animation: hop 0.5s steps(1, end) infinite; }
.pet.cheer { -webkit-animation: hop 0.25s steps(1, end) 3; animation: hop 0.25s steps(1, end) 3; }
@-webkit-keyframes breathe { 0%{-webkit-transform:translateY(0)} 50%{-webkit-transform:translateY(4px)} 100%{-webkit-transform:translateY(0)} }
@keyframes breathe { 0%{transform:translateY(0)} 50%{transform:translateY(4px)} 100%{transform:translateY(0)} }
@-webkit-keyframes bob { 0%{-webkit-transform:translateY(0)} 50%{-webkit-transform:translateY(-8px)} 100%{-webkit-transform:translateY(0)} }
@keyframes bob { 0%{transform:translateY(0)} 50%{transform:translateY(-8px)} 100%{transform:translateY(0)} }
@-webkit-keyframes hop { 0%{-webkit-transform:translateY(0)} 50%{-webkit-transform:translateY(-26px)} 100%{-webkit-transform:translateY(0)} }
@keyframes hop { 0%{transform:translateY(0)} 50%{transform:translateY(-26px)} 100%{transform:translateY(0)} }
@-webkit-keyframes zzz { 0%{opacity:0;-webkit-transform:translateY(8px)} 40%{opacity:1} 100%{opacity:0;-webkit-transform:translateY(-10px)} }
@keyframes zzz { 0%{opacity:0;transform:translateY(8px)} 40%{opacity:1} 100%{opacity:0;transform:translateY(-10px)} }

.heart { position: absolute; bottom: 90px; width: 28px; height: 25px; -webkit-animation: rise 1.4s steps(7, end) forwards; animation: rise 1.4s steps(7, end) forwards; pointer-events: none; }
@-webkit-keyframes rise { 0%{opacity:1;-webkit-transform:translateY(0)} 100%{opacity:0;-webkit-transform:translateY(-84px)} }
@keyframes rise { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-84px)} }

.dots { display: flex; justify-content: center; flex-wrap: wrap; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--navy); background: #fff; margin: 3px 4px; transition: background 0.2s; }
.dot.on { background: var(--pink); }
.count { font-size: 22px; font-weight: 700; }

.loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--sky); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--muted); z-index: 999; }

@-webkit-keyframes pop { 0%{opacity:0;-webkit-transform:scale(0) rotate(0deg) translate(var(--tx),var(--ty))} 45%{opacity:1;-webkit-transform:scale(1.3) rotate(150deg) translate(var(--tx),var(--ty))} 100%{opacity:0;-webkit-transform:scale(0.4) rotate(310deg) translate(var(--tx),var(--ty))} }
@keyframes pop { 0%{opacity:0;transform:scale(0) rotate(0deg) translate(var(--tx),var(--ty))} 45%{opacity:1;transform:scale(1.3) rotate(150deg) translate(var(--tx),var(--ty))} 100%{opacity:0;transform:scale(0.4) rotate(310deg) translate(var(--tx),var(--ty))} }
.spark { position: fixed; pointer-events: none; font-size: 26px; z-index: 500; -webkit-animation: pop 0.75s ease-out forwards; animation: pop 0.75s ease-out forwards; }

@media (prefers-reduced-motion: reduce) {
  .pet, .pet ~ .zzz, .bed .zzz, .heart, .spark { -webkit-animation: none !important; animation: none !important; }
}

/* BLACKOUT */
.blackout { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; -webkit-flex-direction: column; flex-direction: column; align-items: center; justify-content: center; }
.blackout.active { display: -webkit-flex; display: flex; }
/* everything on this screen stays dim: it is a bedroom at night */
.clock { font-size: 84px; font-weight: 700; letter-spacing: -3px; color: #4a6a90; line-height: 1; margin-bottom: 22px; }
.clock small { font-size: 28px; letter-spacing: 0; margin-left: 10px; color: #35506f; }
.bed { position: relative; width: 480px; height: 315px; }
#bed-art, .bed svg { width: 100%; height: 100%; display: block; }
.bed .zzz { display: block; top: 6px; right: 70px; color: #3a5576; -webkit-animation: zzz 2.4s steps(4) infinite; animation: zzz 2.4s steps(4) infinite; }
.wake-btn { margin-top: 26px; background: #1a1a1a; border: none; border-radius: 14px; padding: 12px 30px; color: #6a6a6a; font-size: 18px; font-weight: 600; cursor: pointer; font-family: inherit; }
.wake-btn:active { background: #2a2a2a; }
</style>
</head>
<body>

<div class="blackout" id="blackout">
  <div class="clock" id="clock"></div>
  <div class="bed"><div id="bed-art"></div><div class="zzz">z z</div></div>
  <button class="wake-btn" onclick="sleepOff()">Wake</button>
</div>

<div class="loading" id="loading">Loading…</div>

<div class="app" style="opacity:0;transition:opacity 0.3s" id="app">
  <div class="top">
    <div class="title" id="name-display">My jobs</div>
    <div class="tabs">
      <div class="tab active" id="tab-daily" onclick="switchTab('daily')">☀️ Daily<small id="daily-reset-label">starts again daily</small></div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">📅 Weekly<small>starts again Friday</small></div>
    </div>
    <button class="tool" onclick="sleepOn()" aria-label="Screen off">🌙</button>
    <button class="tool" onclick="window.location.reload(true)" aria-label="Refresh">🔄</button>
  </div>

  <div class="content">
    <div class="left">
      <div class="chore-grid" id="chore-grid"></div>
      <div class="complete" id="complete">
        <div class="big-emoji">🎉</div>
        <div class="congrats" id="congrats-name">You did it!</div>
        <div class="won-label">You earned</div>
        <div class="reward-won" id="reward-won"></div>
        <button class="reset-btn" onclick="manualReset()">Start again</button>
      </div>
      <div class="reward" id="reward-strip">Finish all <span id="total-n">6</span> to win: <span id="reward-display"></span></div>
    </div>

    <div class="device">
      <div class="speech" id="speech">Zzz… wake me with a job!</div>
      <div class="lcd" onclick="petTap()">
        <div class="ground"></div>
        <div class="pet sleep" id="pet"></div>
        <div class="zzz">z z</div>
      </div>
      <div class="dots" id="dots"></div>
      <div class="count" id="count">0 of 6</div>
    </div>
  </div>
</div>

<script>
// iOS Safari: 100vh is taller than the visible screen, so the bottom gets cut off. Size to what is really visible.
function fitApp(){document.getElementById('app').style.height=window.innerHeight+'px';}
fitApp();window.addEventListener('resize',fitApp);window.addEventListener('orientationchange',fitApp);
var CONFIG_URL = window.CHORE_CONFIG_URL || '/api/config';
var config = null, activeTab = 'daily';

function ls(k,fb){try{var v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch(e){return fb;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function thisWeekKey(){var d=new Date();var day=d.getDay();var diff=d.getDate()-((day+2)%7);var fri=new Date(new Date().setDate(diff));return fri.getFullYear()+'-'+(fri.getMonth()+1)+'-'+fri.getDate();}

// Same storage keys and reset rules as before, so ticks already on the iPad survive the redesign.
function getDone(type){
  var key=type==='daily'?'au_d_done':'au_w_done';
  var tsKey=type==='daily'?'au_d_ts':'au_w_ts';
  var curTs=type==='daily'?todayKey():thisWeekKey();
  if(ls(tsKey,null)!==curTs){ss(tsKey,curTs);ss(key,[]);return[];}
  return ls(key,[]);
}
function saveDone(type,done){ss(type==='daily'?'au_d_done':'au_w_done',done);}

var dDone=getDone('daily'),wDone=getDone('weekly');
function getDoneArr(){return activeTab==='daily'?dDone:wDone;}
function total(){return config?config[activeTab].chores.length:6;}

/* ── Pixel pal ───────────────────────────────────────────
   16x16 art, one string per row. o outline, b body, s shade, w shine, p/d pink.
   An original little creature: round, light blue, cat-ish ears, a pink bow. */
var BODY=[
"..oo........oo..",
".obbo......obbo.",
".obbbooooooobbo.",
"obbbbbbbbbbbbbbo",
"obwwbbbbbbbbbbbo",
"obwbbbbbbbbbbbbo",
"obbbbbbbbbbbbbbo",
"obbbbbbbbbbbbbbo",
"obbbbbbbbbbbbbbo",
"obbbbbbbbbbbbbbo",
".obbbbbbbbbbbbo.",
".obssssssssssbo.",
"..oobbbbbbbboo..",
"..obbo....obbo..",
"..oooo....oooo..",
"................"];
var COLORS={o:'#2b4c7e',b:'#9fd6f5',s:'#7fbfe6',w:'#ffffff',p:'#ff8fb1',d:'#e0608a'};
// face pixels: [row, col, colour]
var BOW=[[2,10,'p'],[2,11,'p'],[2,13,'p'],[2,14,'p'],[3,10,'p'],[3,11,'p'],[3,12,'d'],[3,13,'p'],[3,14,'p'],[4,10,'p'],[4,11,'p'],[4,13,'p'],[4,14,'p']];
var CHEEKS=[[8,2,'p'],[8,3,'p'],[8,12,'p'],[8,13,'p']];
function eyesOpen(){return [[5,4,'o'],[5,5,'o'],[6,4,'o'],[6,5,'o'],[5,10,'o'],[5,11,'o'],[6,10,'o'],[6,11,'o'],[5,4,'w']];}
var EYES_SHUT=[[6,4,'o'],[6,5,'o'],[6,10,'o'],[6,11,'o']];
var EYES_HAPPY=[[5,5,'o'],[6,4,'o'],[6,6,'o'],[5,11,'o'],[6,10,'o'],[6,12,'o']];
var MOUTH_SMILE=[[8,6,'o'],[9,7,'o'],[9,8,'o'],[8,9,'o']];
var MOUTH_OPEN=[[8,6,'o'],[8,7,'o'],[8,8,'o'],[8,9,'o'],[9,7,'o'],[9,8,'o']];
var MOUTH_SLEEP=[[9,7,'o'],[9,8,'o']];
var FACES={sleep:[EYES_SHUT,MOUTH_SLEEP],idle:[null,MOUTH_SMILE],happy:[EYES_HAPPY,MOUTH_OPEN],dance:[EYES_HAPPY,MOUTH_OPEN]};
var blink=false;

function petSvg(state){
  var px={};
  BODY.forEach(function(row,r){for(var c=0;c<row.length;c++){if(row[c]!=='.')px[r+','+c]=COLORS[row[c]];}});
  var f=FACES[state];
  var eyes=f[0]||(blink?EYES_SHUT:eyesOpen());
  [BOW,CHEEKS,eyes,f[1]].forEach(function(layer){layer.forEach(function(p){px[p[0]+','+p[1]]=COLORS[p[2]];});});
  var out='<svg viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">';
  for(var k in px){var rc=k.split(',');out+='<rect x="'+rc[1]+'" y="'+rc[0]+'" width="1" height="1" fill="'+px[k]+'"/>';}
  return out+'</svg>';
}

/* ── Sleep screen: the pal tucked in bed, all colours dimmed. 32x21 grid, rects are [x,y,w,h,colour]. */
var NIGHT={o:'#16202f',b:'#4a6f8c',s:'#3b5a75',w:'#4a6f8c',p:'#8a4a62',d:'#6e3a4e'};
var BED_BACK=[[3,0,26,13,'#1d1829'],[4,1,24,12,'#2a2336'],[5,9,22,5,'#16202f'],[6,10,20,3,'#3a4f70']];
var BED_FRONT=[[2,12,28,7,'#16202f'],[3,13,26,5,'#3d3870'],[3,13,26,1,'#4b4584'],[3,16,26,1,'#4b4584'],[2,19,28,2,'#2a2336'],[3,19,2,2,'#1d1829'],[27,19,2,2,'#1d1829']];
function bedSvg(){
  var out='<svg viewBox="0 0 32 21" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">';
  function rect(r){out+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+r[4]+'"/>';}
  BED_BACK.forEach(rect);
  var px={};
  for(var r=0;r<10;r++){for(var c=0;c<16;c++){if(BODY[r][c]!=='.')px[r+','+c]=NIGHT[BODY[r][c]];}}
  [BOW,CHEEKS,EYES_SHUT,MOUTH_SLEEP].forEach(function(layer){layer.forEach(function(p){px[p[0]+','+p[1]]=NIGHT[p[2]];});});
  for(var k in px){var rc=k.split(',');out+='<rect x="'+(+rc[1]+8)+'" y="'+(+rc[0]+2)+'" width="1" height="1" fill="'+px[k]+'"/>';}
  BED_FRONT.forEach(rect);
  return out+'</svg>';
}
var clockTimer=null;
function tickClock(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes();
  document.getElementById('clock').innerHTML=((h%12)||12)+':'+(m<10?'0':'')+m+'<small>'+(h<12?'am':'pm')+'</small>';
}
function sleepOn(){
  document.getElementById('bed-art').innerHTML=bedSvg();
  tickClock();clearInterval(clockTimer);clockTimer=setInterval(tickClock,5000);
  document.getElementById('blackout').classList.add('active');
}
function sleepOff(){
  clearInterval(clockTimer);
  document.getElementById('blackout').classList.remove('active');
}

var HEART='<svg viewBox="0 0 7 6" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><path fill="#ff8fb1" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/><path fill="#2b4c7e" d="M1 0h2v1H1zM4 0h2v1H4zM0 1h1v2H0zM6 1h1v2H6zM1 3h1v1H1zM5 3h1v1H5zM2 4h1v1H2zM4 4h1v1H4zM3 5h1v1H3zM3 1h1v1H3z" opacity="0"/></svg>';
function floatHeart(){
  var lcd=document.querySelector('.lcd'),h=document.createElement('div');
  h.className='heart';h.innerHTML=HEART;
  h.style.left=(50+Math.round((Math.random()-0.5)*90))+'px';
  lcd.appendChild(h);
  setTimeout(function(){if(h.parentNode)h.parentNode.removeChild(h);},1500);
}

var petState='',danceTimer=null;
function setPet(state){
  var el=document.getElementById('pet');
  if(petState!==state){
    petState=state;
    el.className='pet '+state;
    clearInterval(danceTimer);danceTimer=null;
    if(state==='dance'){floatHeart();danceTimer=setInterval(floatHeart,700);}
  }
  el.innerHTML=petSvg(state);
}
function stateFor(n,N){return n===0?'sleep':n>=N?'dance':n*2>=N?'happy':'idle';}
function speechFor(n,N){
  if(n===0)return 'Zzz… wake me with a job!';
  if(n>=N)return 'We did it!!';
  if(n===N-1)return 'Just one more!';
  return ['Yay! I woke up!','Keep going!','Halfway there!','Nearly there!'][Math.min(n-1,3)];
}
function petTap(){
  var el=document.getElementById('pet');
  if(petState==='sleep'){return;}
  var keep=el.className;
  el.className='pet cheer';floatHeart();
  setTimeout(function(){el.className=keep;},800);
}
setInterval(function(){if(petState==='idle'||petState==='happy'){blink=true;setPet(petState);setTimeout(function(){blink=false;setPet(petState);},160);}},3600);

function updatePet(n){
  var N=total();
  setPet(stateFor(n,N));
  document.getElementById('speech').textContent=speechFor(n,N);
  document.getElementById('count').textContent=n+' of '+N;
  var dots='';for(var i=0;i<N;i++){dots+='<div class="dot'+(i<n?' on':'')+'"></div>';}
  document.getElementById('dots').innerHTML=dots;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  if(!config)return;
  var name=config.child_name||'';
  var tab=config[activeTab];
  var done=getDoneArr();
  var N=tab.chores.length;
  var all=done.length>=N;
  document.getElementById('name-display').textContent=name?name+'’s jobs':'My jobs';
  document.getElementById('reward-display').textContent=tab.reward;
  document.getElementById('total-n').textContent=N;
  document.getElementById('reward-won').textContent=tab.reward;
  document.getElementById('congrats-name').textContent=name?'You did it, '+name+'!':'You did it!';
  document.getElementById('tab-daily').className='tab'+(activeTab==='daily'?' active':'');
  document.getElementById('tab-weekly').className='tab'+(activeTab==='weekly'?' active':'');
  var grid=document.getElementById('chore-grid');
  var banner=document.getElementById('complete');
  grid.style.display=all?'none':'';
  document.getElementById('reward-strip').style.display=all?'none':'';
  if(all){banner.classList.add('show');}else{banner.classList.remove('show');}
  if(!all){
    grid.innerHTML='';
    tab.chores.forEach(function(c,i){
      var isDone=done.indexOf(i)!==-1;
      var card=document.createElement('div');
      card.className='chore'+(isDone?' done':'');
      card.innerHTML='<div class="chore-emoji">'+esc(c.emoji)+'</div><div class="chore-name">'+esc(c.name)+'</div><svg class="stamp" viewBox="0 0 7 6" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><path fill="#ff8fb1" stroke="#2b4c7e" stroke-width="0.5" d="M1 0.5h1.5L3.5 1.5L4.5 0.5H6L6.5 1.5V3L3.5 5.5L0.5 3V1.5z"/></svg>';
      card.onclick=function(){toggleChore(i,card);};
      grid.appendChild(card);
    });
  }
  updatePet(done.length);
}

function switchTab(tab){activeTab=tab;render();}

function toggleChore(i,card){
  var done=getDoneArr(),N=total();
  var at=done.indexOf(i);
  if(at!==-1){
    var nd=done.filter(function(x){return x!==i;});
    if(activeTab==='daily')dDone=nd;else wDone=nd;
    card.classList.remove('done');
    saveDone(activeTab,nd);
    updatePet(nd.length);
  } else {
    done.push(i);
    if(activeTab==='daily')dDone=done;else wDone=done;
    card.classList.add('done');
    spawnSparks(card);
    saveDone(activeTab,done);
    updatePet(done.length);
    if(done.length<N){var el=document.getElementById('pet');var keep=el.className;el.className='pet cheer';setTimeout(function(){el.className=keep;},800);}
    if(done.length>=N){setTimeout(render,700);}
  }
}

var SPARKS=['✨','⭐','🌟','💫','🎉'];
function spawnSparks(el){
  var r=el.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  SPARKS.forEach(function(s,i){
    var sp=document.createElement('div');
    sp.className='spark';
    var tx=Math.round((Math.random()-0.5)*120),ty=Math.round((Math.random()-0.5)*120);
    sp.style.cssText='left:'+Math.round(cx)+'px;top:'+Math.round(cy)+'px;--tx:'+tx+'px;--ty:'+ty+'px;animation-delay:'+(i*75)+'ms;-webkit-animation-delay:'+(i*75)+'ms';
    sp.textContent=s;
    document.body.appendChild(sp);
    setTimeout(function(){sp.remove();},950);
  });
}

function manualReset(){
  if(activeTab==='daily'){dDone=[];saveDone('daily',[]);}
  else{wDone=[];saveDone('weekly',[]);}
  render();
}

function loadConfig(){
  fetch(CONFIG_URL+'?t='+Date.now()).then(function(res){return res.json();}).then(function(c){config=c;},function(){
    config={child_name:'',daily:{reward:'Ice cream',chores:[{emoji:'🛏️',name:'Make bed'},{emoji:'🦷',name:'Brush teeth'},{emoji:'🧺',name:'Tidy toys'},{emoji:'🍽️',name:'Clear dishes'},{emoji:'🐾',name:'Feed pet'},{emoji:'👗',name:'Get dressed'}]},weekly:{reward:'Movie night',chores:[{emoji:'🧹',name:'Vacuum room'},{emoji:'🪟',name:'Wipe surfaces'},{emoji:'🗑️',name:'Empty bins'},{emoji:'🧴',name:'Tidy bathroom'},{emoji:'👟',name:'Sort shoes'},{emoji:'📚',name:'Tidy bookshelf'}]}};
  }).then(function(){
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.opacity='1';
    render();
  });
}
loadConfig();
</script>
</body>
</html>
